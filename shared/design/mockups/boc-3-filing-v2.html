<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOC-3 filing page v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2233; --steel:#225E8A; --steel-dk:#9CC7E8; --signal:#E89A3C; --paper:#F7F5F1; --cloud:#FFFFFF;
  --slate:#4F5E6B; --success:#2E7D5B; --line:rgba(79,94,107,.16);
  --shadow:0 1px 2px rgba(14,34,51,.06),0 4px 16px rgba(14,34,51,.08);
}
*{box-sizing:border-box}
body{margin:0;background:#E7E3DC;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;padding:0}

/* demo chrome */
.demo{position:sticky;top:0;z-index:50;background:#08141f;color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.demo strong{font-family:Archivo;font-size:15px}
.demo label{display:flex;gap:8px;align-items:center}
.demo select,.demo button{font:inherit;font-size:14px;border-radius:8px;border:1px solid #42576a;background:#17324a;color:#fff;padding:7px 10px;cursor:pointer}
.demo .segd{display:flex;border:1px solid #42576a;border-radius:8px;overflow:hidden}
.demo .segd button{border:0;border-radius:0;background:transparent}
.demo .segd button[aria-pressed=true]{background:var(--steel)}
.demo-note{max-width:1500px;margin:14px auto 0;padding:0 20px;font-size:13px;color:#3d4a55}
.stage{display:flex;flex-wrap:wrap;gap:32px;padding:20px;align-items:flex-start;justify-content:center}
.dev-col{display:flex;flex-direction:column;gap:8px}
.dev-cap{font-size:13px;font-weight:600;color:#3d4a55}
.phone{width:395px;height:832px;border-radius:48px;background:#0E2233;padding:10px;box-shadow:0 30px 60px rgba(14,34,51,.25);flex:none}
.screen{position:relative;overflow:hidden;background:var(--paper)}
.phone .screen{width:375px;height:812px;border-radius:38px}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.laptop-box{flex:none}
.laptop{width:1280px;height:800px;border-radius:12px;border:1px solid #c9c3b8;box-shadow:0 30px 60px rgba(14,34,51,.18);transform-origin:top left;background:var(--paper)}
.laptop .screen{width:100%;height:100%;border-radius:12px}
.stage[data-view=phone] .laptop-col{display:none}
.stage[data-view=laptop] .phone-col{display:none}

/* page */
.pg{container-type:inline-size;container-name:pg;background:var(--paper);font-size:16px;line-height:1.6;color:var(--ink)}
.pg a{color:inherit}
.pg :focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:4px}
.dark :focus-visible{outline-color:#fff}
.ct{width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.band{padding:56px 0}
.ink{background:var(--ink);color:#fff}
.cloud{background:var(--cloud)}
.h2{font-family:Archivo;font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:0}
/* site header */
.sh{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.sh-in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.sh-logo{width:96px;color:#fff;display:block}
.sh-r{display:flex;gap:10px;align-items:center}
.icobtn{width:44px;height:44px;border-radius:6px;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;background:none}
.burger{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.sh .nav,.sh .sh-cta,.sh .sh-tel{display:none}
/* breadcrumbs */
.bc{font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(255,255,255,.7);margin:0}
.bc a{text-decoration:none}
.bc b{font-weight:500;color:#fff}
/* hero */
.hero{padding:32px 0 56px}
.hero-grid{display:grid;gap:24px;margin-top:20px}
.h1{font-family:Archivo;font-weight:800;font-size:32px;line-height:1.08;letter-spacing:-.02em;margin:0;color:#fff}
.h1 span{color:var(--signal)}
.intro{font-size:17px;line-height:1.6;color:rgba(255,255,255,.8);margin:0;max-width:60ch}
.rev{font-family:"IBM Plex Mono",monospace;font-size:14px;color:rgba(255,255,255,.7);margin:16px 0 0}
.rev .u{text-transform:uppercase;letter-spacing:.08em}
.rev b{font-weight:500;color:#fff}
/* FMCSA line: variant A */
.fm{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:15px;line-height:22px;color:rgba(255,255,255,.8)}
.fm svg.st{color:var(--steel-dk);flex:none;margin-top:1px}
.fm strong{color:#fff;font-weight:600}
.fm a,.fm-in a,.fm-c a{color:#fff;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.fm a:hover,.fm-in a:hover,.fm-c a:hover{color:var(--signal)}
.ext{display:inline-block;vertical-align:-2px;margin-left:3px}
/* variant B: inside the intro */
.fm-in{color:#fff;font-weight:500;text-decoration:underline;text-decoration-color:rgba(156,199,232,.55);text-decoration-thickness:2px;text-underline-offset:5px}
.fm-in-link{font-weight:500}
/* variant C: under the card */
.fm-c{margin:12px 0 0;font-size:14px;line-height:20px;color:rgba(255,255,255,.85);display:flex;gap:8px;align-items:flex-start}
.fm-c svg{color:var(--steel-dk);flex:none;margin-top:1px}
.fm-c strong{color:#fff;font-weight:600}
/* order card (as built) */
.oc{background:#fff;border:1px solid rgba(79,94,107,.15);border-radius:8px;padding:16px;box-shadow:var(--shadow);color:var(--ink)}
.oc-t{font-family:Archivo;font-weight:700;font-size:18px;line-height:1.4;margin:0}
.oc-s{font-size:14px;color:var(--slate);margin:2px 0 0}
.oc label{display:block;font-size:14px;font-weight:500;margin-top:12px}
.oc input{display:block;width:100%;margin-top:4px;border-radius:8px;border:1px solid rgba(79,94,107,.25);background:var(--paper);padding:10px 16px;font:inherit;font-size:18px;color:var(--ink)}
.oc input:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:6px;border:0;background:var(--signal);color:var(--ink)!important;font:inherit;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.oc .btn{width:100%;margin-top:10px}
.oc-fee{display:flex;gap:6px;align-items:center;justify-content:center;font-size:14px;margin:12px 0 0}
.oc-fee svg{color:var(--success)}
.oc-rt{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--slate);margin:6px 0 0;text-decoration:none}
.stars{display:inline-flex;gap:2px;color:var(--signal)}
.disc{font-size:12px;line-height:18px;color:rgba(255,255,255,.6);margin:12px 0 0}
/* sections */
.what p{color:var(--slate);margin:16px 0 0;max-width:68ch}
.who ul{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:14px}
.who li{display:flex;gap:12px;color:rgba(255,255,255,.9)}
.who li svg{flex:none;margin-top:3px;color:var(--steel-dk)}
.who li.no svg{color:rgba(255,255,255,.55)}
.who a{font-weight:500;text-decoration:underline;text-underline-offset:4px}
.callout{margin:28px 0 0;border-left:4px solid var(--signal);background:rgba(255,255,255,.05);border-radius:0 8px 8px 0;padding:14px 16px;color:rgba(255,255,255,.85)}
.callout b{color:#fff;font-weight:600}
.callout a{font-weight:500;text-decoration:underline;text-underline-offset:4px}
.how .lead{margin:16px 0 0;font-weight:500;font-size:17px}
.steps{list-style:none;margin:24px 0 0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 22px 48px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--steel);color:var(--steel);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;background:#fff}
.steps .tx{display:block;padding-top:4px}
.steps a{color:var(--steel);font-weight:500;text-decoration:underline;text-underline-offset:4px}
.price{margin:32px 0 0;border:1px solid rgba(79,94,107,.2);border-radius:8px;background:var(--paper);padding:16px;display:grid;gap:14px}
.price-v{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:500;line-height:1.1}
.price-l{display:block;font-size:14px;color:var(--slate);margin-top:4px}
.price p{margin:0;color:var(--slate)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:6px;background:var(--ink);color:#fff!important;font-weight:600;text-decoration:none;white-space:nowrap}
.btn2:hover{background:#1b3549}
.price .btn2{width:100%}
.case p{margin:16px 0 0;color:rgba(255,255,255,.82);max-width:62ch}
.case .q{border-left:4px solid var(--signal);padding-left:16px;margin-top:20px}
.case .q p:first-child{margin-top:0}
.faq{margin-top:24px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-family:Archivo;font-weight:600;font-size:18px;line-height:1.35;cursor:pointer;list-style:none;min-height:56px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;color:var(--steel);transition:transform .2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq p{margin:0;padding:0 0 16px;color:var(--slate);max-width:68ch}
.faq a{color:var(--steel);font-weight:500}
.close-grid{display:grid;gap:24px}
.close-t{font-family:Archivo;font-weight:700;font-size:24px;line-height:1.3;margin:0;color:#fff}
/* footer */
.sf{background:var(--ink);color:rgba(255,255,255,.75);font-size:14px;padding:48px 0 32px;border-top:1px solid rgba(255,255,255,.12)}
.sf-logo{width:120px;color:#fff;display:block}
.sf p{margin:12px 0 0}
.sf .mono{font-family:"IBM Plex Mono",monospace;font-size:13px}
.sf-cols{display:grid;gap:24px;margin-top:32px}
.sf .fh{font-family:"IBM Plex Sans";font-size:13px;font-weight:600;color:#fff;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.sf ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sf a{text-decoration:none}
.sf-legal{margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
/* sticky bar (phone) */
.sbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(14,34,51,.10);transition:transform .2s ease,visibility 0s linear 0s;margin-top:-72px}
.sbar.hide{transform:translateY(110%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
.sbar-t{flex:1;min-width:0;font-size:13px;line-height:18px;color:var(--slate)}
.sbar-t b{display:block;font-family:Archivo;font-size:16px;color:var(--ink);font-weight:700}
.sbar .btn{min-height:48px;padding:0 20px}
@media (prefers-reduced-motion:reduce){.sbar,.faq summary svg{transition:none!important}}

@container pg (min-width: 768px){
  .ct{padding:0 24px}
  .band{padding:96px 0}
}
@container pg (min-width: 1024px){
  .sh .nav{display:flex;gap:28px;font-size:14px;color:rgba(255,255,255,.85)}
  .nav span{display:inline-flex;gap:4px;align-items:center}
  .sh .sh-cta{display:inline-flex;min-height:40px;padding:0 16px;font-size:14px}
  .sh .sh-tel{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff;font-size:14px;text-decoration:none}
  .sh .icobtn,.sh .burger{display:none}
  .sh-logo{width:104px}
  .hero{padding:48px 0 96px}
  .hero-grid{grid-template-columns:1fr 1fr;column-gap:64px;row-gap:0;margin-top:24px;align-items:start}
  .h1{font-size:56px;grid-column:1;grid-row:1}
  .hg-fm{grid-column:1;grid-row:2;margin-top:20px}
  .hg-card{grid-column:2;grid-row:1 / span 4}
  .hg-intro{grid-column:1;grid-row:3;margin-top:20px}
  .intro{font-size:18px}
  .oc{padding:24px}
  .h2{font-size:30px}
  /* light sections: heading left, content right */
  .split{display:grid;grid-template-columns:4fr 8fr;column-gap:64px;align-items:start}
  .split>.h2{position:sticky;top:96px}
  .split .what-body p:first-child,.split .how-body>.lead:first-child{margin-top:0}
  .narrow{max-width:768px}
  .price{grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:20px 24px}
  .price .btn2{width:auto}
  .case p{font-size:18px}
  .close-grid{grid-template-columns:1fr 440px;column-gap:64px;align-items:center}
  .close-t{font-size:30px}
  .sf-cols{grid-template-columns:2fr 1fr 1fr 1fr}
  .sbar{display:none}
}
</style>
</head>
<body>
<div class="demo" role="region" aria-label="Mockup controls">
  <strong>/boc-3-filing/ v2 (mockup)</strong>
  <label>FMCSA line
    <select id="fm">
      <option value="A">A. Own line under the H1, linked (recommended)</option>
      <option value="B">B. Emphasised inside the intro, linked</option>
      <option value="C">C. Paired with the disclaimer under the card</option>
    </select>
  </label>
  <div class="segd" role="group" aria-label="Viewport">
    <button data-view="both" aria-pressed="true">Both</button>
    <button data-view="phone" aria-pressed="false">Phone 375</button>
    <button data-view="laptop" aria-pressed="false">Laptop 1280</button>
  </div>
</div>
<p class="demo-note">Real page copy. Prices, form and links are inert. On the phone, a sticky "File your BOC-3" bar appears once the hero card scrolls away and hides again when the closing card is on screen; its button scrolls back to the USDOT field.</p>

<div class="stage" id="stage" data-view="both">
  <div class="dev-col phone-col"><div class="dev-cap">Phone, 375 x 812</div>
    <div class="phone"><div class="screen"><div class="scroller" id="phoneHost"></div></div></div></div>
  <div class="dev-col laptop-col"><div class="dev-cap">Laptop, 1280 x 800 <span id="scaleNote"></span></div>
    <div class="laptop-box" id="laptopBox"><div class="laptop" id="laptop"><div class="screen"><div class="scroller" id="laptopHost"></div></div></div></div></div>
</div>

function listingLink(cls){return '<a href="'+LISTING+'" target="_blank" rel="noopener nofollow" class="'+(cls||"")+'" data-inert>See our listing<span class="sr"> on fmcsa.dot.gov (opens in a new tab)</span>'+I.ext+'</a>';}

function card(P,v){
  return '<div><div class="oc" id="'+P+'file"><p class="oc-t">File your BOC-3 today for $45</p><p class="oc-s">Takes about 2 minutes. No forms to fill out.</p>'+
    '<form data-inert><label for="'+P+'usdot">USDOT number</label><input id="'+P+'usdot" inputmode="numeric" autocomplete="off" enterkeyhint="go" placeholder="e.g. 1234567">'+

    '<p class="oc-fee">'+I.seal+'<span>$45 one-time fee. <strong>No annual renewals.</strong></span></p>'+
    '<a class="oc-rt" href="#" data-inert><span class="stars" role="img" aria-label="5.0 out of 5 stars">'+I.star+I.star+I.star+I.star+I.star+'</span>5.0 on Google</a></div>'+

    '<p class="disc">We\'re a private BOC-3 process agent company listed with FMCSA, not part of FMCSA or any government agency.</p></div>';
}

    '<h2 class="h2">How our BOC-3 filing works</h2><div class="how-body">'+

  '</div></div></div></section>'+
  /* case */

function faq(q,a){return '<details><summary>'+q+I.chev+'</summary><p>'+a+'</p></details>';}

function mount(host,v){
  var P=host.id+"-";
  host.innerHTML=page(P,v);
  host.scrollTop=0;
}
var hosts=[document.getElementById("phoneHost"),document.getElementById("laptopHost")];
/* one set of listeners per host, attached once */
hosts.forEach(function(host){
  host.addEventListener("click",function(e){
    var inert=e.target.closest("[data-inert],a[href='#']");
    var act=e.target.closest("[data-act]");
    if(act&&act.getAttribute("data-act")==="tofile"){
      e.preventDefault();
      var inp=host.querySelector("#"+host.id+"-usdot");
      var k=host.getBoundingClientRect().height/host.offsetHeight||1;
      host.scrollTo({top:host.scrollTop+(inp.getBoundingClientRect().top-host.getBoundingClientRect().top)/k-140,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
      inp.focus({preventScroll:true});return;
    }
    if(inert&&!e.target.closest("summary"))e.preventDefault();
  });
  host.addEventListener("submit",function(e){e.preventDefault();});
  host.addEventListener("scroll",function(){updateBar(host);},{passive:true});
});
function updateBar(host){
  var bar=host.querySelector(".sbar");if(!bar)return;
  var P=host.id+"-";
  var card=host.querySelector("#"+P+"file"), close=host.querySelector("#"+P+"closing");
  var hb=host.getBoundingClientRect();
  var cardGone=card.getBoundingClientRect().bottom<hb.top+64;
  var closeIn=close.getBoundingClientRect().top<hb.bottom;
  bar.classList.toggle("hide",!(cardGone&&!closeIn));
}
function apply(){var v=document.getElementById("fm").value;hosts.forEach(function(h){mount(h,v);});}
function fit(){
  var stage=document.getElementById("stage"),view=stage.getAttribute("data-view");
  var cw=document.documentElement.clientWidth;var avail=cw-40-(view==="both"&&cw>1100?395+32:0);
  var k=view==="phone"?1:Math.min(1,avail/1280);
  document.getElementById("laptop").style.transform="scale("+k+")";
  var box=document.getElementById("laptopBox");box.style.width=(1280*k)+"px";box.style.height=(800*k)+"px";
  document.getElementById("scaleNote").textContent=k<1?"(shown at "+Math.round(k*100)+"%)":"";
}
document.getElementById("fm").addEventListener("change",apply);
document.querySelectorAll(".segd button").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll(".segd button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
  document.getElementById("stage").setAttribute("data-view",b.getAttribute("data-view"));fit();});});
window.addEventListener("resize",fit);
apply();fit();
})();
</script>
